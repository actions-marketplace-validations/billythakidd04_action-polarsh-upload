name: Test & Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Build Distribution Bundle
        run: npm run build

      - name: Verify Bundle Cleanliness
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "::error::Uncommitted changes in dist/. Run 'npm run build' locally before committing."
            git diff dist/
            exit 1
          fi
